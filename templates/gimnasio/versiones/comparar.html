<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FORJA Gym — comparar versiones</title>
<style>
  :root {
    --bg: #111113;
    --panel: #18181b;
    --line: #2a2a2f;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --coral: #8b91ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 14px; font-weight: 600; }
  header p { color: var(--muted); font-size: 13px; }
  .seg {
    display: inline-flex;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
  }
  .seg button {
    padding: 6px 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--text); color: #111113; }
  .seg button:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
  .spacer { flex: 1; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    min-height: 0;
    background: var(--line);
  }
  main[data-view="actual"] { grid-template-columns: 1fr 0; }
  main[data-view="nueva"]  { grid-template-columns: 0 1fr; }
  .pane {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--bg);
  }
  .pane-label {
    display: flex;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
  }
  .pane-label b { color: var(--text); font-weight: 600; }
  .pane-label { align-items: center; }
  .pane-label a { color: var(--muted); }
  .pick {
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-weight: 600;
  }
  .pick:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
  .stage {
    position: relative;
    flex: 1;
    overflow: hidden;
  }
  /* El iframe se renderiza al ancho real del dispositivo y se reduce
     para entrar en la columna. Así se ve la versión de escritorio de
     verdad, no la móvil apretada. */
  .stage iframe {
    position: absolute;
    top: 0;
    left: 50%;
    border: 0;
    background: #fff;
    transform-origin: top center;
  }
  .stage[data-device="mobile"] iframe {
    top: 16px;
    border-radius: 28px;
    box-shadow: 0 0 0 10px #000, 0 30px 60px -20px rgba(0, 0, 0, 0.8);
  }
</style>
</head>
<body>

<header>
  <h1>FORJA Gym, comparar</h1>
  <p>Versiones archivadas. Elige qué ver en cada lado.</p>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="Vista">
    <button type="button" data-view="lado" aria-pressed="true">Lado a lado</button>
    <button type="button" data-view="actual" aria-pressed="false">Solo izquierda</button>
    <button type="button" data-view="nueva" aria-pressed="false">Solo derecha</button>
  </div>
  <div class="seg" role="group" aria-label="Dispositivo">
    <button type="button" data-device="desktop" aria-pressed="true">Escritorio</button>
    <button type="button" data-device="mobile" aria-pressed="false">Móvil</button>
  </div>
</header>

<main data-view="lado">
  <section class="pane">
    <div class="pane-label"><select class="pick" aria-label="Versión de este lado"><option value="../index.html">Actual · WHOOP</option><option value="./industrial/index.html" selected>Industrial (oct 2026)</option></select><a class="open" href="./industrial/index.html" target="_blank" rel="noopener">abrir ↗</a></div>
    <div class="stage" data-device="desktop"><iframe src="./industrial/index.html" title="Versión izquierda"></iframe></div>
  </section>
  <section class="pane">
    <div class="pane-label"><select class="pick" aria-label="Versión de este lado"><option value="../index.html" selected>Actual · WHOOP</option><option value="./industrial/index.html">Industrial (oct 2026)</option></select><a class="open" href="../index.html" target="_blank" rel="noopener">abrir ↗</a></div>
    <div class="stage" data-device="desktop"><iframe src="../index.html" title="Versión derecha"></iframe></div>
  </section>
</main>

<script>
  (function () {
    var SIZES = { desktop: [1280, 860], mobile: [390, 844] };
    var main = document.querySelector("main");
    var stages = [].slice.call(document.querySelectorAll(".stage"));
    var device = "desktop";

    function fit() {
      var size = SIZES[device];
      stages.forEach(function (stage) {
        var frame = stage.querySelector("iframe");
        stage.setAttribute("data-device", device);
        var pad = device === "mobile" ? 32 : 0;
        var w = stage.clientWidth;
        var h = stage.clientHeight;
        if (!w) return;
        var scale = Math.min(1, w / size[0], device === "mobile" ? (h - pad) / size[1] : Infinity);
        frame.style.width = size[0] + "px";
        frame.style.height = (device === "mobile" ? size[1] : h / scale) + "px";
        frame.style.transform = "translateX(-50%) scale(" + scale + ")";
      });
    }

    function press(group, value) {
      document.querySelectorAll("[data-" + group + "]").forEach(function (b) {
        if (b.tagName !== "BUTTON") return;
        b.setAttribute("aria-pressed", String(b.getAttribute("data-" + group) === value));
      });
    }

    document.querySelectorAll("button[data-view]").forEach(function (b) {
      b.addEventListener("click", function () {
        main.setAttribute("data-view", b.dataset.view);
        press("view", b.dataset.view);
        requestAnimationFrame(fit);
      });
    });

    document.querySelectorAll("button[data-device]").forEach(function (b) {
      b.addEventListener("click", function () {
        device = b.dataset.device;
        press("device", device);
        fit();
      });
    });

    document.querySelectorAll(".pane").forEach(function (pane) {
      var pick = pane.querySelector(".pick");
      var frame = pane.querySelector("iframe");
      var open = pane.querySelector(".open");
      pick.addEventListener("change", function () {
        frame.src = pick.value;
        open.href = pick.value;
      });
    });

    window.addEventListener("resize", fit);
    fit();
  })();
</script>
</body>
</html>
